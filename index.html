<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Garage</title>
<meta name="description" content="BS Garage">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Outfit:wght@400;600;800&amp;family=Noto+Sans+JP:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --cyan-lt:  #A8F2FA;
    --cyan:     #34C6E0;
    --cyan-dk:  #1B93B8;
    --pink:     #FF3D93;
    --pink-lt:  #FFAECB;
    --green-lt: #C6F07A;
    --green:    #5FC257;
    --ink:      #0E3A46;
    --paper:    #FFFFFF;
    --wash-1:   #FFFFFF;
    --wash-2:   #E9FAFD;
    --body-tx:  #14424F;
    --muted:    #5C8792;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wash-1: #06222E;
      --wash-2: #0B3B4E;
      --body-tx: #DCF6FB;
      --muted:  #7FB3C0;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }
  html { overflow-x: hidden; scroll-behavior: smooth; } /* decorative clusters bleed past the edge; clip rather than pan */

  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--wash-1) 0%, var(--wash-2) 100%);
    color: var(--body-tx);
    font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* the first screen: card centred over the florals and rocker stripe */
  .hero {
    position: relative;
    min-height: calc(100vh - 150px); /* leave a strip of the next section showing so it reads as scrollable */
    min-height: calc(100svh - 150px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem 5rem;
  }

  /* ---------- floral clusters ---------- */
  /* real livery vectors (hibiscus + plumeria + vine), carries its own
     gradients so it's loaded as an image rather than inlined (the gradient
     ids would collide with the page's own defs) */
  .cluster {
    position: absolute;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    height: auto;
    filter: drop-shadow(0 6px 10px rgba(14, 58, 70, 0.22));
  }
  .cluster-a {
    top: -2.75rem; left: -3.5rem;
    width: clamp(300px, 36vw, 460px);
    transform: rotate(-6deg);
  }
  .cluster-b {
    bottom: 3.25rem; right: -3.5rem; /* clears the rocker stripe's 51px height */
    width: clamp(280px, 34vw, 430px);
    transform: scaleX(-1) rotate(-6deg); /* mirrored so the vine curls the other way */
  }

  @media (max-width: 640px) {
    .cluster-a { top: -1.5rem;  left: -3rem;  width: 260px; opacity: 0.92; }
    .cluster-b { bottom: 3.5rem; right: -3rem; width: 240px; opacity: 0.92; }
    .badge { font-size: 0.62rem; letter-spacing: 0.16em; padding: 0.4rem 0.85rem; }
    .tagline { font-size: 0.95rem; }
  }

  /* ---------- hero ---------- */
  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 680px;
    width: 100%;
    min-width: 0; /* let the SVG wordmark shrink instead of forcing its 900px intrinsic width */
  }

  .glow {
    position: absolute;
    z-index: 1;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(760px, 105vw);
    height: min(560px, 80vh);
    background: radial-gradient(circle, rgba(52,198,224,0.22), rgba(52,198,224,0) 68%);
    pointer-events: none;
  }

  .badge {
    display: inline-block;
    font-family: "Outfit", sans-serif;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    background: var(--pink);
    padding: 0.45rem 1.1rem;
    border-radius: 999px;
    margin-bottom: 1.6rem;
    transform: rotate(-2deg);
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink), 0 6px 0 -1px rgba(14,58,70,0.22);
  }
  .badge .jp {
    font-family: "Noto Sans JP", sans-serif;
    letter-spacing: 0.1em;
  }

  .wordmark {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    overflow: visible;
  }
  .wm { font-family: "Lilita One", Impact, "Arial Black", sans-serif; font-size: 148px; }
  .wm-shadow { fill: var(--ink); stroke: var(--ink); stroke-width: 26; paint-order: stroke; opacity: 0.28; }
  .wm-key    { fill: none; stroke: #fff;      stroke-width: 30; paint-order: stroke; stroke-linejoin: round; }
  .wm-ink    { fill: none; stroke: var(--ink); stroke-width: 15; paint-order: stroke; stroke-linejoin: round; }
  .wm-fill   { fill: url(#cyanText); }

  .url-strip {
    display: inline-block;
    margin-top: 0.35rem;
    font-family: "Lilita One", sans-serif;
    font-size: clamp(0.95rem, 3vw, 1.35rem);
    letter-spacing: 0.02em;
    color: #fff;
    background: linear-gradient(180deg, var(--cyan-lt), var(--cyan) 52%, var(--cyan-dk));
    padding: 0.3rem 1.15rem 0.35rem;
    border-radius: 6px;
    transform: skewX(-8deg) rotate(-1deg);
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink), 0 7px 0 -1px rgba(14,58,70,0.25);
    text-shadow: 0 2px 0 rgba(14,58,70,0.35);
  }

  .tagline {
    margin: 2.1rem auto 0;
    max-width: 30rem;
    font-size: 1.02rem;
    line-height: 1.65;
    color: var(--body-tx);
  }
  .tagline .jp {
    font-family: "Noto Sans JP", sans-serif;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
  }

  /* ---------- sticker sheet ---------- */
  .sheet {
    margin-top: 2.2rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.85rem 0.95rem;
    justify-content: center;
  }
  .chip {
    font-family: "Lilita One", sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    padding: 0.32rem 0.85rem 0.36rem;
    border-radius: 5px;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 5px 0 -1px rgba(14,58,70,0.2);
    white-space: nowrap;
  }
  .chip.c1 { background: var(--cyan);  transform: rotate(-3deg); }
  .chip.c2 { background: var(--pink);  transform: rotate(2deg); }
  .chip.c3 { background: var(--green); transform: rotate(-1.5deg); }
  .chip.c4 { background: var(--ink);   transform: rotate(2.5deg); }
  .chip.jp { font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 0.75rem; }

  /* ---------- status ---------- */
  .status {
    margin-top: 2.4rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--muted);
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 10px var(--pink);
    animation: pulse 1.9s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ---------- social links ---------- */
  .socials {
    margin-top: 2.8rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    justify-content: center;
  }
  .social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    font-family: "Lilita One", sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    padding: 0.4rem 0.9rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 4px 0 -1px rgba(14,58,70,0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .social-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 6px 0 -1px rgba(14,58,70,0.3);
  }
  .social-btn.yt { background: #FF0000; transform: rotate(-1deg); }
  .social-btn.ig { background: linear-gradient(135deg, #833AB4, #FD1D1D, #FCAF45); transform: rotate(1.5deg); }
  .social-btn.yt:hover, .social-btn.ig:hover { filter: brightness(0.95); }

  /* ---------- scroll cue ---------- */
  .scroll-cue {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    margin-top: 2.2rem;
    font-family: "Lilita One", sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cyan-lt);
    text-decoration: none;
  }
  .scroll-cue .arrow {
    font-size: 1.4rem;
    line-height: 1;
    animation: bob 1.6s ease-in-out infinite;
  }
  .scroll-cue:hover { color: #fff; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
  @media (prefers-color-scheme: light) { .scroll-cue { color: var(--cyan-dk); } .scroll-cue:hover { color: var(--ink); } }
  .gallery { scroll-margin-top: 1rem; }

  /* ---------- rocker stripe (the car's pink side skirt) ---------- */
  .rocker {
    position: absolute;
    bottom: 0; left: -5%;
    width: 110%;
    height: 46px;
    z-index: 1;
    transform: rotate(-1.1deg);
    pointer-events: none;
  }
  .rocker .bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 26px;
    background: var(--pink);
  }
  .rocker .pin {
    position: absolute;
    bottom: 26px; left: 0; right: 0;
    height: 5px;
    background: var(--cyan);
  }


  /* ---------- gallery ---------- */
  .gallery {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 6rem;
  }
  .gallery-title {
    margin: 0 0 3rem;
    text-align: center;
    font-family: "Lilita One", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: 0.02em;
    color: var(--ink);
    -webkit-text-stroke: 0;
    text-shadow: 0 3px 0 #fff, 0 0 0 var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    .gallery-title { color: var(--cyan-lt); text-shadow: 0 3px 0 var(--ink); }
  }
  .shots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-flow: dense;
    gap: 1.6rem;
  }
  .shot {
    margin: 0;
    background: #fff;
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 8px 0 -1px rgba(14,58,70,0.22);
    transition: transform 0.25s ease;
  }
  .shot img {
    display: block;
    width: 100%;
    height: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    border-radius: 4px;
  }
  .shot figcaption {
    padding: 0.45rem 0.2rem 0.1rem;
    font-family: "Outfit", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-align: center;
  }
  .shot img { height: auto; }
  .shot.tall { grid-row: span 2; }
  .shot.tall { display: flex; }
  .shot.tall img { aspect-ratio: auto; height: auto; flex: 1; min-height: 0; }
  .s1 { transform: rotate(-1.6deg); }
  .s2 { transform: rotate(1.2deg); }
  .s3 { transform: rotate(-0.8deg); }
  .s4 { transform: rotate(1.8deg); }
  .s5 { transform: rotate(-1.2deg); }
  .s6 { transform: rotate(1deg); }
  .s7 { transform: rotate(-1.8deg); }
  .s8 { transform: rotate(1.4deg); }
  .s9 { transform: rotate(-1.1deg); }
  .s10 { transform: rotate(1.6deg); }
  .s11 { transform: rotate(-1.5deg); }
  .shot:hover { transform: rotate(0deg) scale(1.03); z-index: 1; }

  @media (max-width: 820px) {
    .shots { grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
  }
  @media (max-width: 520px) {
    .shots { grid-template-columns: 1fr; }
    .shot.tall { grid-row: auto; }
    .shot.tall img { aspect-ratio: 4 / 5; flex: none; }
  }



  /* ---------- friends & sponsors ---------- */
  .partners {
    position: relative;
    z-index: 2;
    max-width: 1000px;
    margin: 0 auto;
    padding: 1rem 1.25rem 7rem;
    text-align: center;
  }
  .partners-sub {
    margin: -1.8rem auto 2.6rem;
    max-width: 28rem;
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .partner-list {
    display: flex;
    flex-wrap: wrap;
    gap: 1.8rem;
    justify-content: center;
  }
  .partner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    width: min(300px, 100%);
    padding: 1rem 1rem 0.7rem;
    background: #fff;
    border-radius: 10px;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 8px 0 -1px rgba(14,58,70,0.22);
    transition: transform 0.25s ease;
  }
  .partner:nth-child(odd)  { transform: rotate(-1.2deg); }
  .partner:nth-child(even) { transform: rotate(1.2deg); }
  a.partner:hover, a.partner:focus-visible { transform: rotate(0deg) scale(1.04); }
  a.partner:focus-visible { outline: 3px solid var(--cyan); outline-offset: 8px; }
  .partner img { display: block; width: 100%; height: auto; }
  .partner-name {
    font-family: "Lilita One", sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ---------- lightbox ---------- */
  .shot { cursor: zoom-in; }
  .shot:focus-visible { outline: 3px solid var(--cyan); outline-offset: 6px; }
  .lightbox {
    border: 0;
    padding: 0;
    background: transparent;
    max-width: none; max-height: none;
    width: 100vw; height: 100vh; height: 100dvh;
    color: #fff;
  }
  .lightbox::backdrop { background: rgba(3, 18, 25, 0.92); }
  .lb-stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 3.5rem 4rem 2.5rem;
    gap: 0.8rem;
  }
  .lb-stage img {
    max-width: 100%;
    max-height: calc(100% - 2rem);
    object-fit: contain;
    background: #fff;
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 18px 50px rgba(0,0,0,0.5);
  }
  .lb-cap { font: 600 0.85rem "Outfit", sans-serif; letter-spacing: 0.04em; color: var(--cyan-lt); min-height: 1.2em; }
  .lb-btn {
    position: absolute;
    width: 46px; height: 46px;
    border: 0; border-radius: 50%;
    background: var(--pink); color: #fff;
    font: 400 1.5rem/1 "Lilita One", sans-serif;
    cursor: pointer;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink);
    display: grid; place-items: center;
  }
  .lb-btn:hover { filter: brightness(1.08); }
  .lb-btn:focus-visible { outline: 3px solid var(--cyan-lt); outline-offset: 5px; }
  .lb-close { top: 1rem; right: 1rem; }
  .lb-prev  { left: 0.9rem;  top: 50%; transform: translateY(-50%); }
  .lb-next  { right: 0.9rem; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) {
    .lb-stage { padding: 4rem 0.75rem 4.5rem; }
    .lb-prev, .lb-next { top: auto; bottom: 0.9rem; transform: none; }
    .lb-prev { left: calc(50% - 60px); }
    .lb-next { right: calc(50% - 60px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot, .scroll-cue .arrow { animation: none; }
    html { scroll-behavior: auto; }
    .shot, .partner { transition: none; }
    .shot:hover { transform: none; }
  }
</style>
</head>
<body>

<!-- ============ wordmark gradient ============ -->
<svg class="defs" aria-hidden="true" width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="cyanText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F2FEFF"/>
      <stop offset="40%"  stop-color="#96EBF7"/>
      <stop offset="43%"  stop-color="#40CAE6"/>
      <stop offset="100%" stop-color="#1B93B8"/>
    </linearGradient>
  </defs>
</svg>

<div class="hero">

<!-- ============ corner florals ============ -->
<!-- real livery vectors, cut from the Zenki side graphic -->
<img class="cluster cluster-a" src="art/floral-duo.svg" alt="" aria-hidden="true">
<img class="cluster cluster-b" src="art/floral-duo.svg" alt="" aria-hidden="true">

<div class="glow"></div>

<!-- ============ hero ============ -->
<main class="card">
  <span class="badge">Drift Adventures </span>

  <svg class="wordmark" viewBox="0 0 900 200" role="img" aria-label="BS Garage">
    <g class="wm" text-anchor="middle">
      <text class="wm-shadow" x="450" y="152" transform="translate(0,9)">BS GARAGE</text>
      <text class="wm-key"    x="450" y="152">BS GARAGE</text>
      <text class="wm-ink"    x="450" y="152">BS GARAGE</text>
      <text class="wm-fill"   x="450" y="152">BS GARAGE</text>
    </g>
  </svg>

  <div><span class="url-strip">www.bs-garage.com</span></div>

  <p class="tagline">
    Follow my adventures with drifting.<br>
    Site's under construction &mdash; check back soon.<br>
  </p>


  <div class="status">
    <span class="dot"></span>
    Currently wrenching on this page
  </div>

  <div class="socials">
    <a href="https://www.youtube.com/@BrandonSerna" class="social-btn yt" target="_blank" rel="noopener">▶ YouTube</a>
    <a href="https://www.instagram.com/brand0ns/" class="social-btn ig" target="_blank" rel="noopener">📷 Instagram</a>
  </div>

  <div><a class="scroll-cue" href="#gallery">Scroll for photos <span class="arrow" aria-hidden="true">&#8595;</span></a></div>
</main>

<div class="rocker" aria-hidden="true">
  <div class="pin"></div>
  <div class="bar"></div>
</div>

</div><!-- /.hero -->

<!-- ============ gallery ============ -->
<section class="gallery" id="gallery" aria-labelledby="gallery-h">
  <h2 id="gallery-h" class="gallery-title">On Track</h2>
  <div class="shots">
    <figure class="shot s1"><img src="photos/528A1822.jpg" alt="Silver S14 Zenki drifting past at speed, background blurred in a panning shot" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s2"><img src="photos/528A9382.jpg" alt="Silver S14 Zenki sliding in a cloud of tire smoke" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s3 tall"><img src="photos/IMG_2225.jpg" alt="Silver S14 Zenki mid-drift on a wide track with tire marks and a second car behind" loading="lazy" width="1206" height="1503"></figure>
    <figure class="shot s4"><img src="photos/528A9419.jpg" alt="Silver S14 Zenki drifting past a crowd with smoke from the rear tires" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s5"><img src="photos/528A0433.jpg" alt="Silver S14 drifting alongside other cars in a smoky tandem" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s6"><img src="photos/IMG_2999.jpg" alt="Tandem drift seen from the crowd, silver S14 chasing a black sedan" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s7"><img src="photos/528A9360.jpg" alt="Silver S14 Zenki sliding in front of a track fence" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s8"><img src="photos/528A9533.jpg" alt="Silver S14 Zenki sliding with smoke trailing behind" loading="lazy" width="1600" height="1067"></figure>
    <figure class="shot s9"><img src="photos/IMG_2218.jpg" alt="Silver S14 Zenki in a tandem drift with a black Toyota sedan in front of the grandstand crowd" loading="lazy" width="1500" height="1028"><figcaption>Photo: LaZarca Media</figcaption></figure>
    <figure class="shot s10"><img src="photos/IMG_2361.jpg" alt="Silver S14 Zenki sliding through a corner past orange cones" loading="lazy" width="1600" height="1067"><figcaption>Photo: Lauren Cobus Photography</figcaption></figure>
    <figure class="shot s11"><img src="photos/IMG_2802.jpg" alt="Black 350Z with lime green wheels drifting, side profile" loading="lazy" width="1600" height="838"><figcaption>Photo: Alonso</figcaption></figure>
  </div>
</section>

<!-- ============ friends & sponsors ============ -->
<!-- add a partner: copy one <.partner> block; use <a href="..."> to make it a link, or <div> if there's no link yet -->
<section class="partners" aria-labelledby="partners-h">
  <h2 id="partners-h" class="gallery-title">Friends</h2>
  <p class="partners-sub">Go show them some love.</p>
  <div class="partner-list">
    <div class="partner">
      <img src="art/partners/asc-auto-fab.png" alt="ASC Auto Fab logo" loading="lazy" width="788" height="280">
      <span class="partner-name">ASC Auto Fab</span>
    </div>
  </div>
</section>

<!-- ============ lightbox ============ -->
<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <div class="lb-stage">
    <img id="lb-img" alt="">
    <div class="lb-cap" id="lb-cap"></div>
  </div>
  <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <button class="lb-btn lb-next" type="button" aria-label="Next photo">&#8250;</button>
</dialog>

<script>
(function () {
  var shots = Array.prototype.slice.call(document.querySelectorAll('.shot'));
  var dlg = document.getElementById('lightbox');
  var big = document.getElementById('lb-img');
  var cap = document.getElementById('lb-cap');
  var cur = 0, startX = null;

  function show(i) {
    cur = (i + shots.length) % shots.length;
    var img = shots[cur].querySelector('img');
    var fc = shots[cur].querySelector('figcaption');
    big.src = img.currentSrc || img.src;
    big.alt = img.alt;
    cap.textContent = fc ? fc.textContent : '';
  }
  function open(i) { show(i); if (!dlg.open) dlg.showModal(); }

  shots.forEach(function (el, i) {
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Enlarge photo ' + (i + 1) + ' of ' + shots.length);
    el.addEventListener('click', function () { open(i); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); }
    });
  });

  dlg.querySelector('.lb-close').addEventListener('click', function () { dlg.close(); });
  dlg.querySelector('.lb-prev').addEventListener('click', function () { show(cur - 1); });
  dlg.querySelector('.lb-next').addEventListener('click', function () { show(cur + 1); });
  // click on the dark area (not the photo or buttons) closes
  dlg.addEventListener('click', function (e) {
    if (e.target === dlg || e.target.classList.contains('lb-stage')) dlg.close();
  });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
  // swipe on touch screens
  dlg.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    startX = null;
  });
})();
</script>

</body>
</html>
