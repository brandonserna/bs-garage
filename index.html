<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Garage</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-2: #141417;
    --line: #232328;
    --text: #eceef1;
    --muted: #8b8d95;
    --accent: #ff3d2e;
    --accent-2: #ffb400;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg) 60%);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* tire-mark stripes drifting across the background */
  .stripe {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.35;
    filter: blur(0.5px);
    transform: rotate(-8deg);
  }
  .stripe.s1 { top: 18%; width: 140%; left: -20%; animation: drift 9s ease-in-out infinite; }
  .stripe.s2 { top: 62%; width: 160%; left: -30%; background: linear-gradient(90deg, transparent, var(--accent-2), transparent); animation: drift 12s ease-in-out infinite reverse; }
  .stripe.s3 { top: 85%; width: 120%; left: -10%; animation: drift 7s ease-in-out infinite; }

  @keyframes drift {
    0%, 100% { transform: rotate(-8deg) translateX(0); }
    50% { transform: rotate(-8deg) translateX(3%); }
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem 2.5rem;
    max-width: 560px;
  }

  .badge {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    margin-bottom: 1.75rem;
  }

  h1 {
    font-size: clamp(2.4rem, 7vw, 4rem);
    line-height: 1;
    margin: 0;
    letter-spacing: -0.02em;
    font-weight: 800;
  }

  h1 span {
    color: var(--accent);
  }

  .tagline {
    margin-top: 1rem;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
  }

  .status {
    margin-top: 2.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 1.5rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 10px var(--accent-2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  footer {
    position: absolute;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    color: #4a4b52;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <div class="stripe s1"></div>
  <div class="stripe s2"></div>
  <div class="stripe s3"></div>

  <div class="card">
    <span class="badge">Est. 2026 &middot; Personal Project</span>
    <h1>BS <span>GARAGE</span></h1>
    <p class="tagline">
      Drift builds, track days, and whatever else lives in the garage.<br>
      Site's under construction &mdash; check back soon.
    </p>
    <div class="status">
      <span class="dot"></span>
      Currently wrenching on this page
    </div>
  </div>

  <footer>bs-garage.com</footer>

</body>
</html>
